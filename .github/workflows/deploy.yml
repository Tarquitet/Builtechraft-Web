name: Deploy Astro with Bun to gh-pages

on:
  push:
    branches: [v2-Astro]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./astro-btc

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: v2-Astro

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Debug files
        run: |
          echo "Current directory:"
          pwd
          echo "Files:"
          ls -la

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build Astro project
        run: bun run build

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./astro-btc/dist
          publish_branch: gh-pages
          commit_message: 'chore: auto-deploy Astro build with Bun from v2-Astro [skip ci]'
