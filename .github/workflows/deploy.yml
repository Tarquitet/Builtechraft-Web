name: Deploy Astro with Bun to gh-pages

on:
  push:
    branches: [v2-Astro] # Tu rama de código fuente actual

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: v2-Astro # Descarga el código de tu rama v2-Astro

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build Astro project
        run: bun run build

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages # Aquí está apuntando correctamente a la rama gh-pages
          commit_message: 'chore: auto-deploy Astro build with Bun from v2-Astro [skip ci]'
